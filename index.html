  <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zodiac Night Sky</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    background:
        radial-gradient(circle at bottom,#1a2d5a 0%,#0a1025 40%,#02040d 100%);
}

.sky{
    position:relative;
    width:100%;
    height:100vh;
}

/* bintang kecil */
.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
}

/* shooting star */
.shooting-star{
    position:absolute;
    width:180px;
    height:2px;
    background:linear-gradient(
        90deg,
        rgba(255,255,255,1),
        rgba(255,255,255,0)
    );
    border-radius:999px;
    transform:rotate(135deg);
    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 15px #fff);
    animation:shoot 1.8s linear forwards;
}

@keyframes shoot{
    from{
        transform:translate(0,0) rotate(135deg);
        opacity:1;
    }
    to{
        transform:translate(-800px,800px) rotate(135deg);
        opacity:0;
    }
}

/* rasi bintang */
.constellation{
    position:absolute;
}

.constellation svg{
    overflow:visible;
}

.constellation line{
    stroke:rgba(255,255,255,.25);
    stroke-width:1;
}

.constellation circle{
    fill:white;
    filter:drop-shadow(0 0 4px white);
}

.label{
    fill:rgba(255,255,255,.8);
    font-size:11px;
    letter-spacing:2px;
}
</style>
</head>
<body>

<div class="sky" id="sky">

    <!-- GEMINI -->
    <div class="constellation" style="top:10%; left:12%;">
        <svg width="120" height="90">
            <line x1="20" y1="20" x2="40" y2="35"/>
            <line x1="40" y1="35" x2="30" y2="60"/>
            <line x1="60" y1="15" x2="80" y2="35"/>
            <line x1="80" y1="35" x2="70" y2="60"/>
            <line x1="40" y1="35" x2="80" y2="35"/>

            <circle cx="20" cy="20" r="2"/>
            <circle cx="40" cy="35" r="2"/>
            <circle cx="30" cy="60" r="2"/>
            <circle cx="60" cy="15" r="2"/>
            <circle cx="80" cy="35" r="2"/>
            <circle cx="70" cy="60" r="2"/>

            <text x="10" y="85" class="label">GEMINI</text>
        </svg>
    </div>

    <!-- SCORPIO -->
    <div class="constellation" style="top:18%; right:15%;">
        <svg width="160" height="100">
            <polyline
                points="10,40 30,45 50,35 70,50 90,40 110,60 130,50"
                fill="none"
                stroke="rgba(255,255,255,.25)"
            />

            <circle cx="10" cy="40" r="2"/>
            <circle cx="30" cy="45" r="2"/>
            <circle cx="50" cy="35" r="2"/>
            <circle cx="70" cy="50" r="2"/>
            <circle cx="90" cy="40" r="2"/>
            <circle cx="110" cy="60" r="2"/>
            <circle cx="130" cy="50" r="2"/>

            <text x="20" y="90" class="label">SCORPIO</text>
        </svg>
    </div>

    <!-- LIBRA -->
    <div class="constellation" style="top:42%; left:8%;">
        <svg width="120" height="90">
            <line x1="20" y1="40" x2="50" y2="20"/>
            <line x1="50" y1="20" x2="80" y2="40"/>
            <line x1="20" y1="40" x2="80" y2="40"/>

            <circle cx="20" cy="40" r="2"/>
            <circle cx="50" cy="20" r="2"/>
            <circle cx="80" cy="40" r="2"/>

            <text x="25" y="75" class="label">LIBRA</text>
        </svg>
    </div>

    <!-- PISCES -->
    <div class="constellation" style="top:55%; right:12%;">
        <svg width="150" height="90">
            <line x1="25" y1="20" x2="70" y2="45"/>
            <line x1="70" y1="45" x2="120" y2="20"/>
            <line x1="25" y1="70" x2="70" y2="45"/>
            <line x1="70" y1="45" x2="120" y2="70"/>

            <circle cx="25" cy="20" r="2"/>
            <circle cx="70" cy="45" r="2"/>
            <circle cx="120" cy="20" r="2"/>
            <circle cx="25" cy="70" r="2"/>
            <circle cx="120" cy="70" r="2"/>

            <text x="40" y="88" class="label">PISCES</text>
        </svg>
    </div>

    <!-- CANCER -->
    <div class="constellation" style="top:70%; left:45%;">
        <svg width="140" height="80">
            <line x1="20" y1="25" x2="55" y2="45"/>
            <line x1="55" y1="45" x2="90" y2="25"/>
            <line x1="90" y1="25" x2="120" y2="50"/>

            <circle cx="20" cy="25" r="2"/>
            <circle cx="55" cy="45" r="2"/>
            <circle cx="90" cy="25" r="2"/>
            <circle cx="120" cy="50" r="2"/>

            <text x="35" y="75" class="label">CANCER</text>
        </svg>
    </div>

</div>

<script>
const sky = document.getElementById("sky");

/* bintang background */
for(let i=0;i<250;i++){
    const star=document.createElement("div");

    const size=Math.random()*2.5+1;

    star.className="star";
    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=Math.random()*4+"s";

    sky.appendChild(star);
}

/* shooting star satu per satu */
function createShootingStar(){

    const star=document.createElement("div");
    star.className="shooting-star";

    star.style.left=
        Math.random()*window.innerWidth+"px";

    star.style.top=
        Math.random()*250+"px";

    sky.appendChild(star);

    setTimeout(()=>{
        star.remove();
    },1800);

    const next=
        2500 + Math.random()*5000;

    setTimeout(createShootingStar,next);
}

createShootingStar();
</script>

</body>
